
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki

# fixes mouse cursor problem
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = WLR_NO_HARDWARE_CURSORS,1



# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1,2560x1440@60,0x0,1.25
workspace=1,monitor:DP-1
workspace=2,monitor:DP-1
workspace=3,monitor:DP-1
workspace=4,monitor:DP-1
workspace=5,monitor:DP-1
monitor=HDMI-A-1,1920x1080@60,2048x0,1
workspace=6,monitor:HDMI-A-1
workspace=7,monitor:HDMI-A-1
workspace=8,monitor:HDMI-A-1
workspace=9,monitor:HDMI-A-1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

#exec = gsettings set org.gnome.desktop.interface cursor-theme 'Catppuccin-Latte-Light'
# waybar launch to make it easier to edit
#exec-once = /home/oyu/startup/launch-waybar

# non-app autostart
#exec-once = nwg-panel #obsolete, quickshell
exec-once = quickshell
exec-once = dunst
exec-once = hypridle
exec-once = hyprpaper
exec-once = hyprctl setcursor Catppuccin-Latte-Light 24
#exec-once = copyq --start-server 
exec-once = wl-paste --watch cliphist store
#exec-once = nm-applet --indicator
exec-once = /usr/libexec/hyprpolkitagent
exec-once = otd-daemon

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = foot
$fileManager = dolphin
$menu = rofi -show combi

# Some default env vars.
env = XCURSOR_SIZE,24
#env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,KDE
env = QT_QPA_PLATFORM,wayland

env = GTK_USE_PORTAL,1

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/

xwayland {
    force_zero_scaling = true
}

input {
    kb_layout = se
    # kb_variant = nodeadkeys
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 2

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 0
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(59598900)
    col.inactive_border = rgba(595959ff)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    
    rounding = 0
    
    blur {
        enabled = false
        size = 7
        passes = 1
    }
    
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier, gnomed
    animation = windowsOut, 1, 5, default, gnomed
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = specialWorkspace, 1, 6, default, slidefadevert 20%
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = true
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    #force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true
    background_color = 0x000000
    col.splash = 0xffffff
    middle_click_paste = false
    enable_anr_dialog = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = corsair-corsair-gaming-m65-pro-rgb-mouse-1 #old mouse
    sensitivity = -0.25 #less sensitivity
    middle_button_emulation = true

    name = endgamegear-op1-gaming-mouse-1 #new mouse
    sensitivity = 0.5 #more sensitivity
    #doesnt need mmb emulation because this device has functioning mmb

}
 
# fixes sluggish mouse
cursor {
    no_hardware_cursors = false
    default_monitor = DP-1
    sync_gsettings_theme = false # doesn't really work and i fix it by just runnig nwg-look -a on startup
}

group {
    groupbar {
        height = 0
        indicator_height = 12
        render_titles = false
        gaps_in = 0
        gaps_out = 0
        keep_upper_gap = false

        gradients = true

        col.active = 0xff3daee9
        col.locked_active = 0xff3daee9
        col.inactive = 0xff31363b
        col.locked_inactive = 0xff31363b
    }
}

exec-once = nwg-look -a # applies gtk theme correctly

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = suppressevent maximize, class:.* # You'll probably like this.

windowrule = float,class:(org.pulseaudio.pavucontrol),title:(Volume Control)
windowrule = size 720 480,class:(org.pulseaudio.pavucontrol),title:(Volume Control)

windowrule = float,class:(com.github.hluk.copyq)
windowrule = size 480 720,class:(com.github.hluk.copyq)

windowrule = float,class:(xdg-desktop-portal-gtk),title:(Open Files)
windowrule = size 720 480,class:(xdg-desktop-portal-gtk),title:(Open Files)

windowrule = pseudo,class:(com.obsproject.Studio)
windowrule = size 920 640,class:(com.obsproject.Studio)
windowrule = workspace special:control,class:(com.obsproject.Studio)

windowrule = pseudo,class:(Spotify)
windowrule = size 920 640,class:(Spotify)
windowrule = workspace special:control,class:(Spotify)
windowrule = pseudo,class:(spotify)
windowrule = size 920 640,class:(spotify)
windowrule = workspace special:control,class:(spotify)

windowrule = group set,class:(equibop)
windowrule = group lock,class:(equibop)
windowrule = group invade,class:(cinny)
windowrule = group invade,class:(org.kde.neochat)
windowrule = group invade,class:(im.riot.Riot)
windowrule = group invade,class:(org.mozilla.firefox)


#SmartGaps( automatic hides gaps if only one window is on the screen )
workspace = w[tv1], gapsout:0, gapsin:0, border:0, rounding:0
workspace = f[1], gapsout:0, gapsin:0, border:0, rounding:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

# inhibit hypridle if an app is fullscreen
windowrule = idleinhibit fullscreen, class:.*
windowrule = idleinhibit focus, class:^(mpv)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, X, killactive,
bind = $mainMod SHIFT, X, forcekillactive,
#bind = $mainMod, M, exit, # dont really want nor need
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Q, togglefloating, 
bind = $mainMod, D, exec, $menu
bind = $mainMod, PERIOD, exec, rofi -modi "emoji:rofimoji" -show emoji
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, P, pseudo
bind = $mainMod, F, fullscreenstate, 1
bind = $mainMod SHIFT, F, fullscreenstate, 2
#bind = $mainMod SHIFT, S, exec, grimblast --freeze save area - | swappy -f - # screenshot
#bind = $mainMod SHIFT, S, exec, grimblast copy area # screenshot
# requires wayfreeze https://github.com/Jappie3/wayfreeze
bind = $mainMod SHIFT, S, exec, wayfreeze --after-freeze-cmd 'grimblast copy area; killall wayfreeze' # screenshot
bind = $mainMod, V, exec, rofi -modi clipboard:/home/oyu/.local/bin/cliphist-rofi-img -show clipboard
#bind = $mainMod, V, exec, copyq toggle
bind = $mainMod, L, exec, hyprlock

#bind = $mainMod, P, exec, ~/.config/hypr/scripts/startstop.sh #freezes and unfreezes activewindow

# OBS replay buffer
bind = ,KP_Insert, exec, obs-cmd replay save

# groups
bind = $mainMod SHIFT, tab, togglegroup
bind = $mainMod, tab, changegroupactive, f

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

# Example special workspace (scratchpad)
bind = $mainMod, 0, togglespecialworkspace, control
bind = $mainMod SHIFT, 0, movetoworkspace, special:control

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#bind workspace 1 to main monitor
#workspace = 1,monitor:DP-1
